name: CI

on:
  push:
    branches: [hydrogen-studies]
  pull_request:

jobs:
  ci:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # Lints server/ and client/src per eslint.config.js. no-floating-promises
      # is error-level (fails CI); no-console is warn-only for now, so warnings
      # do not block. Tighten with --max-warnings once the count is driven down.
      # Non-blocking initially: 191 pre-existing no-floating-promises
      # violations. Drive the count down, then remove continue-on-error to
      # make this a hard gate.
      - name: Lint
        run: npx eslint server client/src
        continue-on-error: true

      # Non-blocking for now: react-quill (abandoned, pins vulnerable quill),
      # exceljs, and sharp still carry high advisories that need a dependency
      # migration/breaking bump (tracked as separate work). Flip to a hard
      # gate (drop continue-on-error) once those are resolved.
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        # --coverage produces the report; the modest per-metric thresholds are
        # enforced here (not in vitest.config.ts) so CI fails if coverage
        # regresses below the current floor. Ratchet these up over time.
        run: >-
          npx vitest run --coverage
          --coverage.thresholds.lines=8
          --coverage.thresholds.statements=8
          --coverage.thresholds.functions=6
          --coverage.thresholds.branches=3

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    # Non-blocking initially: report failures without gating the merge queue.
    # Remove continue-on-error once the suite is stable in CI.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydrogen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hydrogen_test
      # Throwaway CI-only secret (ephemeral CI Postgres, never prod). Must be
      # >=32 chars: the E2E server runs with NODE_ENV=production (see the "Run
      # E2E tests" step), and the production guard rejects shorter secrets —
      # which crashed the Playwright webServer on startup before any test ran.
      SESSION_SECRET: 217b9cbb59d60f45f3ea428a2fedb37b01767849c3d4d9f8
      # The E2E server runs with NODE_ENV=production, whose CORS policy rejects
      # any origin not on the allowlist (it does NOT auto-allow localhost the
      # way development mode does). Playwright drives the app at localhost:5000,
      # so its same-origin API writes carry Origin: http://localhost:5000 and
      # were all blocked ("Not allowed by CORS"). Allowlist the test origin.
      ALLOWED_ORIGINS: http://localhost:5000
      # Bypass Shopify App Proxy HMAC verification for /proxy/* so the E2E suite
      # can drive those routes directly (it can't forge Shopify's signature).
      # Read ONLY by shopifyProxyAuth in server/app.ts; set ONLY here in CI,
      # never in any deployed environment.
      E2E_PROXY_BYPASS: "1"
      # Disable rate limiting during E2E: Playwright drives hundreds of same-IP
      # requests and its HeadlessChrome UA trips isBot(), so the page-GET limiter
      # would 429 the SPA shell mid-run. Read only by the limiters' skip
      # predicate; set ONLY here in CI, never in a deployed environment.
      E2E_DISABLE_RATE_LIMIT: "1"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Push database schema
        run: npm run db:push

      - name: Seed test data
        # E2E asserts on real content (study/blog listings, detail pages,
        # search, proxy sitemap/CSV). Seed a deterministic dataset so those
        # tests exercise populated pages instead of empty-state fallbacks.
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Run E2E tests
        # NODE_ENV=production so playwright.config.ts starts the built app via
        # `npm start` against the seeded Postgres service.
        run: NODE_ENV=production npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
