name: CI

on:
  push:
    branches: [main, hydrogen-studies]
  pull_request:
    branches: [main, hydrogen-studies]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not configured — skipping E2E tests"
            echo "SKIP_E2E=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP_E2E != 'true'
      - uses: actions/setup-node@v4
        if: env.SKIP_E2E != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.SKIP_E2E != 'true'
      - run: npx playwright install --with-deps chromium
        if: env.SKIP_E2E != 'true'
      - run: npm run build
        if: env.SKIP_E2E != 'true'
      - name: Run E2E tests
        if: env.SKIP_E2E != 'true'
        run: npx playwright test --project=chromium
        env:
          SESSION_SECRET: ci-test-secret
          NODE_ENV: production
          CI: true
