name: CI

on:
  push:
    branches: [hydrogen-studies]
  pull_request:

jobs:
  ci:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # Non-blocking for now: react-quill (abandoned, pins vulnerable quill),
      # exceljs, and sharp still carry high advisories that need a dependency
      # migration/breaking bump (tracked as separate work). Flip to a hard
      # gate (drop continue-on-error) once those are resolved.
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run
