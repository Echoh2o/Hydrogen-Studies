<svg width="250" height="200" viewBox="0 0 250 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="125" cy="90" r="60" fill="#00A7B5" opacity="0.08"/>

  <!-- Hydrogen Atom Representation -->
  <circle cx="125" cy="90" r="22" fill="#00A7B5"/>

  <!-- Electron Orbit 1 -->
  <ellipse cx="125" cy="90" rx="52" ry="36" stroke="#00A7B5" stroke-width="2" transform="rotate(30 125 90)"/>

  <!-- Electron Orbit 2 -->
  <ellipse cx="125" cy="90" rx="48" ry="42" stroke="#007E89" stroke-width="2" transform="rotate(-30 125 90)"/>

  <!-- Electron 1 -->
  <circle cx="177" cy="90" r="5" fill="#00A7B5"/>

  <!-- Electron 2 -->
  <circle cx="78" cy="78" r="5" fill="#007E89"/>

  <!-- H2 Text -->
  <text x="117" y="96" font-family="Montserrat, Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">H₂</text>

  <!-- Brand Name -->
  <text x="125" y="150" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="16" fill="#111827" text-anchor="middle" letter-spacing="3">HYDROGEN STUDIES</text>
  <text x="125" y="167" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="8" fill="#00A7B5" text-anchor="middle" letter-spacing="2.5">POWERED BY ECHO WATER</text>
</svg>
