<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogen Studies Research Database</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .search-box { width: 100%; max-width: 600px; padding: 12px; margin: 20px auto; display: block; border: 2px solid #ddd; border-radius: 8px; }
        .categories { margin: 20px 0; }
        .category-btn { margin: 5px; padding: 8px 16px; border: 1px solid #ddd; background: #f5f5f5; border-radius: 4px; cursor: pointer; }
        .category-btn.active { background: #007bff; color: white; }
        .studies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .study-card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; background: white; }
        .study-title { font-weight: bold; margin-bottom: 8px; color: #333; }
        .study-authors { color: #666; font-size: 0.9em; margin-bottom: 8px; }
        .study-abstract { color: #555; line-height: 1.4; }
        .loading { text-align: center; padding: 40px; }
        .error { color: red; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [studies, setStudies] = useState([]);
            const [categories, setCategories] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');

            // Fetch studies
            const fetchStudies = async (search = '', category = '') => {
                try {
                    setLoading(true);
                    const params = new URLSearchParams();
                    if (search) params.append('search', search);
                    if (category) params.append('category', category);
                    params.append('limit', '20');

                    const response = await fetch(`/api/studies?${params}`);
                    if (!response.ok) throw new Error('Failed to fetch studies');
                    const data = await response.json();
                    setStudies(data);
                    setError(null);
                } catch (err) {
                    setError('Failed to load studies: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            // Fetch categories
            const fetchCategories = async () => {
                try {
                    const response = await fetch('/api/categories');
                    if (!response.ok) throw new Error('Failed to fetch categories');
                    const data = await response.json();
                    setCategories(data);
                } catch (err) {
                    console.error('Failed to load categories:', err);
                }
            };

            // Initial load
            useEffect(() => {
                fetchStudies();
                fetchCategories();
            }, []);

            // Handle search
            const handleSearch = (e) => {
                e.preventDefault();
                fetchStudies(searchTerm, selectedCategory);
            };

            // Handle category filter
            const handleCategoryFilter = (category) => {
                const newCategory = selectedCategory === category ? '' : category;
                setSelectedCategory(newCategory);
                fetchStudies(searchTerm, newCategory);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>Hydrogen Studies Research Database</h1>
                        <p>Explore {studies.length > 0 ? `${studies.length} of 1,304` : '1,304'} peer-reviewed hydrogen research studies</p>
                    </div>

                    <form onSubmit={handleSearch} style={{textAlign: 'center'}}>
                        <input
                            type="text"
                            className="search-box"
                            placeholder="Search studies by title or abstract..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <button type="submit" style={{padding: '12px 24px', marginLeft: '10px', border: 'none', background: '#007bff', color: 'white', borderRadius: '4px', cursor: 'pointer'}}>
                            Search
                        </button>
                    </form>

                    <div className="categories">
                        <h3>Filter by Category:</h3>
                        <button 
                            className={`category-btn ${selectedCategory === '' ? 'active' : ''}`}
                            onClick={() => handleCategoryFilter('')}
                        >
                            All Studies
                        </button>
                        {categories.map(cat => (
                            <button
                                key={cat.category}
                                className={`category-btn ${selectedCategory === cat.category ? 'active' : ''}`}
                                onClick={() => handleCategoryFilter(cat.category)}
                            >
                                {cat.category} ({cat.count})
                            </button>
                        ))}
                    </div>

                    {error && <div className="error">{error}</div>}
                    
                    {loading && <div className="loading">Loading studies...</div>}

                    <div className="studies-grid">
                        {studies.map(study => (
                            <div key={study.id} className="study-card">
                                <div className="study-title">{study.title}</div>
                                <div className="study-authors">{study.authors}</div>
                                <div className="study-abstract">
                                    {study.abstract ? study.abstract.substring(0, 200) + '...' : 'No abstract available'}
                                </div>
                                {study.journal && (
                                    <div style={{marginTop: '8px', fontSize: '0.8em', color: '#888'}}>
                                        Published in: {study.journal}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {studies.length === 0 && !loading && !error && (
                        <div style={{textAlign: 'center', padding: '40px', color: '#666'}}>
                            No studies found. Try adjusting your search or category filter.
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
