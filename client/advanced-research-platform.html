<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Advanced Hydrogen Research Platform | 1,304 Scientific Studies</title>
    <meta name="description" content="Advanced research platform for hydrogen health studies. Filter by year, country, study type, journal, peer review status, sample size and more. Access 1,304 peer-reviewed studies.">
    <meta name="keywords" content="hydrogen research, scientific studies, peer-reviewed, medical research, advanced search, research database, molecular hydrogen, clinical trials">
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Advanced Hydrogen Research Platform">
    <meta property="og:description" content="Comprehensive filtering and analysis of hydrogen health research studies">
    
    <!-- Schema.org -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SearchAction",
        "target": {
            "@type": "EntryPoint",
            "urlTemplate": "/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
    }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            line-height: 1.6; 
            color: #2d3748; 
            background: #f8fafc;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            max-width: 1400px;
            margin: 0 auto;
            gap: 30px;
            padding: 30px 20px;
        }
        
        /* Filters Sidebar */
        .filters-sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            height: fit-content;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 20px;
        }
        
        .filters-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .filter-section:last-child {
            border-bottom: none;
        }
        
        .filter-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 10px;
            display: block;
        }
        
        .filter-input, .filter-select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .year-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .filter-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }
        
        .clear-filters {
            width: 100%;
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .clear-filters:hover {
            background: #e2e8f0;
        }
        
        /* Content Area */
        .content-area {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        
        /* Search Bar */
        .search-section {
            padding: 25px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        /* Results Header */
        .results-header {
            padding: 25px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .results-info {
            font-size: 1.1rem;
            color: #4a5568;
        }
        
        .sort-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .sort-select {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        /* Results Grid */
        .results-container {
            padding: 25px;
        }
        
        .studies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .study-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
        }
        
        .study-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
        }
        
        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .study-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .study-badge {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .study-badge.peer-reviewed {
            background: #48bb78;
        }
        
        .study-badge.full-text {
            background: #ed8936;
        }
        
        .study-year {
            background: #f7fafc;
            color: #4a5568;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .study-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .study-authors {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .study-abstract {
            color: #4a5568;
            line-height: 1.5;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        
        .study-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        
        .meta-label {
            color: #718096;
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .meta-value {
            color: #2d3748;
            font-weight: 600;
        }
        
        /* Loading & Error States */
        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .no-results {
            text-align: center;
            padding: 60px;
            color: #718096;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .pagination-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .pagination-btn:hover:not(.disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: white;
            margin: 3% auto;
            padding: 40px;
            width: 90%;
            max-width: 900px;
            border-radius: 20px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            cursor: pointer;
            color: #718096;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .filters-sidebar {
                position: static;
            }
        }
        
        @media (max-width: 768px) {
            .studies-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .results-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Advanced Hydrogen Research Platform</h1>
        <p class="header-subtitle">Comprehensive filtering and analysis of 1,304 hydrogen health studies</p>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Filters Sidebar -->
        <aside class="filters-sidebar">
            <h3 class="filters-title">🔍 Advanced Filters</h3>
            
            <div class="filter-section">
                <label class="filter-label">Publication Year Range</label>
                <div class="year-range">
                    <input type="number" class="filter-input" id="year-from" placeholder="From" min="1990" max="2024">
                    <input type="number" class="filter-input" id="year-to" placeholder="To" min="1990" max="2024">
                </div>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Country</label>
                <select class="filter-select" id="country-filter">
                    <option value="">All Countries</option>
                </select>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Study Type</label>
                <select class="filter-select" id="study-type-filter">
                    <option value="">All Study Types</option>
                </select>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Journal</label>
                <select class="filter-select" id="journal-filter">
                    <option value="">All Journals</option>
                </select>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Category</label>
                <select class="filter-select" id="category-filter">
                    <option value="">All Categories</option>
                </select>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Minimum Sample Size</label>
                <input type="number" class="filter-input" id="sample-size-filter" placeholder="e.g. 50" min="1">
            </div>
            
            <div class="filter-section">
                <label class="filter-label">Study Quality</label>
                <div class="filter-checkbox">
                    <input type="checkbox" id="peer-reviewed-filter">
                    <label for="peer-reviewed-filter">Peer Reviewed Only</label>
                </div>
                <div class="filter-checkbox">
                    <input type="checkbox" id="full-text-filter">
                    <label for="full-text-filter">Full Text Available</label>
                </div>
            </div>
            
            <button class="clear-filters" onclick="clearAllFilters()">Clear All Filters</button>
        </aside>

        <!-- Content Area -->
        <main class="content-area">
            <!-- Search Section -->
            <section class="search-section">
                <form class="search-box" id="search-form">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="search-input"
                        placeholder="Search studies by title, abstract, keywords, authors..."
                    >
                    <button type="submit" class="search-btn">Search</button>
                </form>
            </section>

            <!-- Results Header -->
            <div class="results-header">
                <div class="results-info">
                    <span id="results-count">0</span> studies found
                </div>
                <div class="sort-controls">
                    <label for="sort-select">Sort by:</label>
                    <select class="sort-select" id="sort-select">
                        <option value="id,DESC">Latest Added</option>
                        <option value="publish_year,DESC">Newest First</option>
                        <option value="publish_year,ASC">Oldest First</option>
                        <option value="citation_count,DESC">Most Cited</option>
                        <option value="sample_size,DESC">Largest Sample</option>
                        <option value="title,ASC">Title A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Results Container -->
            <div class="results-container">
                <div id="error-container"></div>
                <div id="loading-container"></div>
                <div id="studies-container"></div>
                
                <div class="pagination" id="pagination-container" style="display: none;">
                    <button class="pagination-btn" id="prev-btn">← Previous</button>
                    <span id="page-info"></span>
                    <button class="pagination-btn" id="next-btn">Next →</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Study Detail Modal -->
    <div class="modal" id="study-modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // Global state
        let currentFilters = {
            search: '',
            category: '',
            year_from: '',
            year_to: '',
            country: '',
            study_type: '',
            journal: '',
            peer_reviewed: '',
            has_full_text: '',
            min_sample_size: '',
            sort_by: 'id',
            sort_order: 'DESC'
        };
        
        let currentPage = 0;
        let pageSize = 20;
        let totalResults = 0;
        let currentStudies = [];

        // DOM elements
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('studies-container');
        const errorContainer = document.getElementById('error-container');
        const loadingContainer = document.getElementById('loading-container');
        const resultsCountEl = document.getElementById('results-count');
        const paginationContainer = document.getElementById('pagination-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');
        const modal = document.getElementById('study-modal');
        const modalClose = document.getElementById('modal-close');
        const modalBody = document.getElementById('modal-body');

        // Filter elements
        const yearFromInput = document.getElementById('year-from');
        const yearToInput = document.getElementById('year-to');
        const countryFilter = document.getElementById('country-filter');
        const studyTypeFilter = document.getElementById('study-type-filter');
        const journalFilter = document.getElementById('journal-filter');
        const categoryFilter = document.getElementById('category-filter');
        const sampleSizeFilter = document.getElementById('sample-size-filter');
        const peerReviewedFilter = document.getElementById('peer-reviewed-filter');
        const fullTextFilter = document.getElementById('full-text-filter');
        const sortSelect = document.getElementById('sort-select');

        // Utility functions
        function showLoading() {
            loadingContainer.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Searching studies...</p>
                </div>
            `;
            errorContainer.innerHTML = '';
        }

        function hideLoading() {
            loadingContainer.innerHTML = '';
        }

        function showError(message) {
            errorContainer.innerHTML = `<div class="error">Error: ${escapeHtml(message)}</div>`;
            hideLoading();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateFiltersFromForm() {
            currentFilters.search = searchInput.value;
            currentFilters.year_from = yearFromInput.value;
            currentFilters.year_to = yearToInput.value;
            currentFilters.country = countryFilter.value;
            currentFilters.study_type = studyTypeFilter.value;
            currentFilters.journal = journalFilter.value;
            currentFilters.category = categoryFilter.value;
            currentFilters.min_sample_size = sampleSizeFilter.value;
            currentFilters.peer_reviewed = peerReviewedFilter.checked ? 'true' : '';
            currentFilters.has_full_text = fullTextFilter.checked ? 'true' : '';
            
            const [sortBy, sortOrder] = sortSelect.value.split(',');
            currentFilters.sort_by = sortBy;
            currentFilters.sort_order = sortOrder;
        }

        // API functions
        async function searchStudies(page = 0) {
            try {
                showLoading();
                updateFiltersFromForm();
                
                const params = new URLSearchParams();
                Object.entries(currentFilters).forEach(([key, value]) => {
                    if (value) params.append(key, value);
                });
                params.append('limit', pageSize.toString());
                params.append('offset', (page * pageSize).toString());

                const response = await fetch(`/api/advanced-search?${params}`);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                
                if (!data || typeof data !== 'object') {
                    throw new Error('Invalid response format');
                }
                
                currentStudies = Array.isArray(data.studies) ? data.studies : [];
                totalResults = parseInt(data.total) || 0;
                currentPage = page;
                
                renderResults();
                updatePagination();
                hideLoading();
                
            } catch (error) {
                console.error('Search error:', error);
                showError(`Search failed: ${error.message || 'Unknown error occurred'}`);
            }
        }

        async function loadFilterOptions() {
            try {
                // Load countries
                const countries = await fetch('/api/filters/countries').then(r => r.json());
                countryFilter.innerHTML = '<option value="">All Countries</option>' +
                    countries.map(c => `<option value="${escapeHtml(c.country)}">${escapeHtml(c.country)} (${c.count})</option>`).join('');

                // Load study types
                const studyTypes = await fetch('/api/filters/study-types').then(r => r.json());
                studyTypeFilter.innerHTML = '<option value="">All Study Types</option>' +
                    studyTypes.map(st => `<option value="${escapeHtml(st.study_type)}">${escapeHtml(st.study_type)} (${st.count})</option>`).join('');

                // Load journals
                const journals = await fetch('/api/filters/journals').then(r => r.json());
                journalFilter.innerHTML = '<option value="">All Journals</option>' +
                    journals.map(j => `<option value="${escapeHtml(j.journal)}">${escapeHtml(j.journal)} (${j.count})</option>`).join('');

                // Load categories
                const categories = await fetch('/api/categories').then(r => r.json());
                categoryFilter.innerHTML = '<option value="">All Categories</option>' +
                    categories.map(c => `<option value="${escapeHtml(c.category)}">${escapeHtml(c.category)} (${c.count})</option>`).join('');

            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        }

        function renderResults() {
            resultsCountEl.textContent = totalResults.toLocaleString();
            
            if (currentStudies.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <h3>No studies found</h3>
                        <p>Try adjusting your search criteria or filters.</p>
                    </div>
                `;
                return;
            }

            const studiesHTML = currentStudies.map(study => `
                <div class="study-card" onclick="openStudyModal(${study.id})">
                    <div class="study-header">
                        <div class="study-badges">
                            ${study.category ? `<span class="study-badge">${escapeHtml(study.category)}</span>` : ''}
                            ${study.peer_reviewed ? '<span class="study-badge peer-reviewed">Peer Reviewed</span>' : ''}
                            ${study.has_full_text ? '<span class="study-badge full-text">Full Text</span>' : ''}
                        </div>
                        ${study.publish_year ? `<span class="study-year">${study.publish_year}</span>` : ''}
                    </div>
                    
                    <div class="study-title">${escapeHtml(study.plain_language_title || study.title)}</div>
                    <div class="study-authors">${escapeHtml(study.authors || 'Unknown Authors')}</div>
                    <div class="study-abstract">
                        ${escapeHtml((study.abstract || 'No abstract available').substring(0, 200))}${study.abstract && study.abstract.length > 200 ? '...' : ''}
                    </div>
                    
                    <div class="study-meta">
                        ${study.journal ? `
                            <div class="meta-item">
                                <span class="meta-label">Journal</span>
                                <span class="meta-value">${escapeHtml(study.journal)}</span>
                            </div>
                        ` : ''}
                        ${study.country ? `
                            <div class="meta-item">
                                <span class="meta-label">Country</span>
                                <span class="meta-value">${escapeHtml(study.country)}</span>
                            </div>
                        ` : ''}
                        ${study.sample_size ? `
                            <div class="meta-item">
                                <span class="meta-label">Sample Size</span>
                                <span class="meta-value">${study.sample_size}</span>
                            </div>
                        ` : ''}
                        ${study.citation_count ? `
                            <div class="meta-item">
                                <span class="meta-label">Citations</span>
                                <span class="meta-value">${study.citation_count}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            resultsContainer.innerHTML = `<div class="studies-grid">${studiesHTML}</div>`;
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalResults / pageSize);
            const hasPages = totalPages > 1;
            
            paginationContainer.style.display = hasPages ? 'flex' : 'none';
            
            if (hasPages) {
                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage >= totalPages - 1;
                
                prevBtn.className = `pagination-btn ${currentPage === 0 ? 'disabled' : ''}`;
                nextBtn.className = `pagination-btn ${currentPage >= totalPages - 1 ? 'disabled' : ''}`;
                
                pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;
            }
        }

        async function openStudyModal(studyId) {
            try {
                modalBody.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading study details...</p></div>';
                modal.style.display = 'block';
                
                const response = await fetch(`/api/studies/${studyId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const study = await response.json();
                
                modalBody.innerHTML = `
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                        ${study.category ? `<span class="study-badge">${escapeHtml(study.category)}</span>` : ''}
                        ${study.peer_reviewed ? '<span class="study-badge peer-reviewed">Peer Reviewed</span>' : ''}
                        ${study.has_full_text ? '<span class="study-badge full-text">Full Text Available</span>' : ''}
                        ${study.publish_year ? `<span class="study-year">${study.publish_year}</span>` : ''}
                    </div>
                    
                    <h2 style="font-size: 1.8rem; margin-bottom: 20px; color: #2d3748; line-height: 1.3;">
                        ${escapeHtml(study.plain_language_title || study.title)}
                    </h2>
                    
                    <p style="color: #718096; margin-bottom: 20px; font-weight: 500; font-size: 1.1rem;">
                        ${escapeHtml(study.authors || 'Unknown Authors')}
                    </p>
                    
                    ${study.image_url ? `
                        <div style="margin-bottom: 30px;">
                            <img src="${escapeHtml(study.image_url)}" alt="${escapeHtml(study.title)}" 
                                 style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px;">
                        </div>
                    ` : ''}
                    
                    <div style="background: #f8fafc; padding: 25px; border-radius: 12px; margin-bottom: 30px;">
                        <h3 style="color: #4a5568; margin-bottom: 15px; font-size: 1.2rem;">Abstract</h3>
                        <p style="line-height: 1.7; color: #2d3748;">${escapeHtml(study.abstract || 'No abstract available')}</p>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                        ${study.journal ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">Journal</h4>
                                <p style="font-weight: 500; color: #2d3748;">${escapeHtml(study.journal)}</p>
                            </div>
                        ` : ''}
                        ${study.country ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">Country</h4>
                                <p style="font-weight: 500; color: #2d3748;">${escapeHtml(study.country)}</p>
                            </div>
                        ` : ''}
                        ${study.study_type ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">Study Type</h4>
                                <p style="font-weight: 500; color: #2d3748;">${escapeHtml(study.study_type)}</p>
                            </div>
                        ` : ''}
                        ${study.sample_size ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">Sample Size</h4>
                                <p style="font-weight: 500; color: #2d3748;">${study.sample_size}</p>
                            </div>
                        ` : ''}
                        ${study.citation_count ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">Citations</h4>
                                <p style="font-weight: 500; color: #2d3748;">${study.citation_count}</p>
                            </div>
                        ` : ''}
                        ${study.doi ? `
                            <div>
                                <h4 style="color: #4a5568; margin-bottom: 8px; font-weight: 600;">DOI</h4>
                                <p style="font-weight: 500; color: #2d3748; word-break: break-all; font-size: 0.9rem;">${escapeHtml(study.doi)}</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        ${study.doi ? `
                            <a href="https://doi.org/${encodeURIComponent(study.doi)}" target="_blank" 
                               style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: 600;">
                                View Full Study
                            </a>
                        ` : ''}
                        ${study.pdf_url ? `
                            <a href="${escapeHtml(study.pdf_url)}" target="_blank" 
                               style="display: inline-block; background: #48bb78; color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: 600;">
                                Download PDF
                            </a>
                        ` : ''}
                    </div>
                `;
            } catch (error) {
                modalBody.innerHTML = `<div class="error">Failed to load study details: ${error.message}</div>`;
            }
        }

        function clearAllFilters() {
            searchInput.value = '';
            yearFromInput.value = '';
            yearToInput.value = '';
            countryFilter.value = '';
            studyTypeFilter.value = '';
            journalFilter.value = '';
            categoryFilter.value = '';
            sampleSizeFilter.value = '';
            peerReviewedFilter.checked = false;
            fullTextFilter.checked = false;
            sortSelect.value = 'id,DESC';
            
            searchStudies(0);
        }

        // Event listeners
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            searchStudies(0);
        });

        [yearFromInput, yearToInput, countryFilter, studyTypeFilter, journalFilter, 
         categoryFilter, sampleSizeFilter, peerReviewedFilter, fullTextFilter, sortSelect].forEach(element => {
            element.addEventListener('change', () => searchStudies(0));
        });

        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) searchStudies(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(totalResults / pageSize);
            if (currentPage < totalPages - 1) searchStudies(currentPage + 1);
        });

        modalClose.addEventListener('click', () => modal.style.display = 'none');
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        // Make functions globally available
        window.openStudyModal = openStudyModal;
        window.clearAllFilters = clearAllFilters;

        // Initialize
        async function init() {
            await loadFilterOptions();
            searchStudies(0);
        }

        init();
    </script>
</body>
</html>
