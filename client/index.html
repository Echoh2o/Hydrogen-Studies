<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO Meta Tags -->
    <title>Hydrogen Studies Research Database</title>
    <meta
      name="description"
      content="Explore a comprehensive database of hydrogen gas research studies and their effects on health. Find peer-reviewed research organized by category."
    />

    <!-- Open Graph Meta Tags for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hydrogen Studies Research Database" />
    <meta
      property="og:description"
      content="Search and explore hydrogen gas research studies and their effects on health, with advanced filtering and categorization."
    />
    <meta property="og:image" content="https://hydrogenstudies.com/logo.png" />
    <meta property="og:site_name" content="Hydrogen Studies" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hydrogen Studies Research Database" />
    <meta
      name="twitter:description"
      content="Search and explore hydrogen gas research studies and their effects on health, with advanced filtering and categorization."
    />
    <meta name="twitter:image" content="https://hydrogenstudies.com/logo.png" />

    <!-- NOTE: no static canonical here. The old hardcoded homepage canonical
         shipped on EVERY SPA-served page (5,522 of 5,523 crawled pages had
         canonical=homepage — crawl 2026-09), which mis-canonicalizes the whole
         site for any non-allowlisted fetcher. Bot-SSR injects the correct
         per-page canonical; pages using Helmet set their own; Phase 3 SSR
         replaces this entirely. -->

    <!-- RSS Feed Discovery -->
    <link rel="alternate" type="application/rss+xml" title="Hydrogen Studies Blog" href="/rss.xml" />

    <!-- Site-wide structured data: Organization + WebSite/SearchAction.
         The bot SSR middleware preserves head <script> tags (extractHeadAssets
         in seo-bot-middleware.ts), so this ships on every bot-rendered page
         alongside the page-specific schema. The homepage previously had NO
         JSON-LD at all (public/search-schema.json existed but was never
         injected anywhere). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://hydrogenstudies.com/#organization",
        "name": "Hydrogen Studies",
        "url": "https://hydrogenstudies.com/",
        "logo": "https://hydrogenstudies.com/logo.png",
        "description": "Evidence-graded database and living reviews of peer-reviewed molecular hydrogen research.",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Echo Technologies LLC",
          "url": "https://echowater.com"
        },
        "funder": {
          "@type": "Organization",
          "name": "Echo Technologies LLC",
          "url": "https://echowater.com"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://hydrogenstudies.com/#website",
        "url": "https://hydrogenstudies.com/",
        "name": "Hydrogen Studies",
        "publisher": { "@id": "https://hydrogenstudies.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://hydrogenstudies.com/improved-search?query={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Ahrefs Analytics is injected at runtime by src/lib/analytics.ts, and
         only after the visitor grants analytics consent (see initAhrefs).
         Do NOT re-add a static <script> tag here — it would fire before
         consent and bypass the cookie banner. -->

    <!-- Google Fonts: Montserrat for Echo Water brand alignment + Fraunces/Plus Jakarta Sans for Learn page -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
