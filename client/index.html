<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Primary SEO Meta Tags -->
    <title>Hydrogen Studies Research Database</title>
    <meta
      name="description"
      content="Explore a comprehensive database of hydrogen gas research studies and their effects on health. Find peer-reviewed research organized by category."
    />

    <!-- Open Graph Meta Tags for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hydrogen Studies Research Database" />
    <meta
      property="og:description"
      content="Search and explore hydrogen gas research studies and their effects on health, with advanced filtering and categorization."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://hydrogenstudies.com/" />
    <meta property="og:site_name" content="Hydrogen Studies" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hydrogen Studies Research Database" />
    <meta
      name="twitter:description"
      content="Search and explore hydrogen gas research studies and their effects on health, with advanced filtering and categorization."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Canonical URL to prevent duplicate content issues -->
    <link rel="canonical" href="https://hydrogenstudies.com/" />

    <!-- Google Fonts: Montserrat for Echo Water brand alignment -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
