<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default Open Graph image for Hydrogen Studies — used when a page-
  specific image isn't available (or when a generated image upload fails).

  Dimensions: 1200×630 — the OG/Twitter Card standard. Most modern
  scrapers (LinkedIn, Slack, Discord, X, modern Facebook) support SVG.
  Older scrapers may fall back gracefully to the page's first <img>.

  Edit the brand colors / wordmark below if the brand updates.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative hydrogen bubbles -->
  <circle cx="950" cy="120" r="180" fill="url(#bubble)"/>
  <circle cx="1080" cy="380" r="100" fill="url(#bubble)"/>
  <circle cx="180" cy="520" r="140" fill="url(#bubble)"/>

  <!-- H2 mark -->
  <g transform="translate(100, 240)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="0" font-size="120" font-weight="800" fill="#ffffff" letter-spacing="-2">
      H<tspan baseline-shift="-32" font-size="72" font-weight="700" fill="#a5f3fc">2</tspan>
    </text>
    <text x="0" y="80" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">
      Hydrogen Studies
    </text>
    <text x="0" y="135" font-size="28" font-weight="500" fill="#bae6fd" letter-spacing="0.5">
      The research database for molecular hydrogen therapy
    </text>
  </g>

  <!-- Subtle wordmark in bottom-right -->
  <text
    x="1140" y="600"
    text-anchor="end"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="20"
    font-weight="500"
    fill="#bae6fd"
    opacity="0.7"
  >hydrogenstudies.com</text>
</svg>
