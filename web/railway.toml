# Railway config for the `web` service (Next.js front door). The service's
# "Config file path" points here so the repo-root railway.toml (Express) is
# not applied to it.
[build]
builder = "RAILPACK"
buildCommand = "npm run build:web"
# Rebuild only when the front door or what it imports changes.
watchPatterns = ["web/**", "shared/**", "client/src/index.css", "tailwind.config.ts", "package.json", "package-lock.json"]

[deploy]
startCommand = "npm run start:web"
healthcheckPath = "/web-health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
